[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP server that lets coding agents offload yes/no, enum and scale judgements to TypeSafe's Jev model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Risso" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]
keywords = ["mcp", "jev", "typesafe", "claude", "classification", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[project.urls]
Homepage = "https://github.com/NicolasRisso/JevMCP"
Issues = "https://github.com/NicolasRisso/JevMCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
